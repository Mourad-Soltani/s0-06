name: schema-tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      TEST_ADMIN_DSN: postgresql://postgres:pw@localhost:5432/postgres   # throwaway service container
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw          # throwaway service container; never a real DSN here
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install postgres client for T15 (pg_dump and pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - run: pip install -r requirements.txt
      - name: Tests (serial because role creation is cluster-scoped)
        shell: bash                       # explicit bash => -eo pipefail, so pytest's exit code survives `| tee`
        run: |
          set -o pipefail
          pytest infra/schema/tests infra/ci/tests shared/tests adapters/tests contracts/tests -v -p no:randomly -p no:xdist --junitxml=junit.xml 2>&1 | tee pytest.log
      - name: Evidence gate (T15 must pass, no unexpected skips, required cases present)
        if: always()
        run: python infra/ci/scripts/ci_gate.py junit.xml
      - name: Mutation check, T10 must fail when FOR SHARE is removed
        if: always()
        shell: bash
        run: |
          set -o pipefail
          n=$(grep -c 'FOR SHARE;' infra/schema/migrations/sql/0001_schema_v0.sql)
          [ "$n" = "2" ] || { echo "mutation tripwire: expected 2 'FOR SHARE;' in the schema, found $n. If the schema changed on purpose, update the mutation step and T10 together."; exit 1; }
          sed 's/FOR SHARE;/;/' infra/schema/migrations/sql/0001_schema_v0.sql > /tmp/mutant.sql
          SCHEMA_SQL=/tmp/mutant.sql pytest infra/schema/tests/test_schema_v0.py -k "T10" -p no:randomly -p no:xdist --junitxml=mutant.xml 2>&1 | tee mutant.log || true
          python infra/ci/scripts/mutation_check.py mutant.xml
      - name: Mutation check for the kill-gate lock (0002)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          f=infra/schema/migrations/sql/0002_outbox_killswitch_cost.sql
          n=$(grep -c 'FOR SHARE) k;' "$f")
          [ "$n" = "1" ] || { echo "mutation tripwire: expected 1 'FOR SHARE) k;' in $f, found $n. If the schema changed on purpose, update this step and the K7 tests together."; exit 1; }
          sed 's/FOR SHARE) k;/) k;/' "$f" > /tmp/mutant0002.sql
          SCHEMA_SQL_0002=/tmp/mutant0002.sql pytest infra/schema/tests/test_migration_0002.py -k "K7" -p no:randomly -p no:xdist --junitxml=mutant2.xml 2>&1 | tee mutant2.log || true
          python infra/ci/scripts/mutation_check.py mutant2.xml --expect test_K7a test_K7b
      - name: Mutation check for the kill-aware claim (0003)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          f=infra/schema/migrations/sql/0003_kill_aware_claim.sql
          p='AND NOT core.outbox_paused(e.marketplace, e.event_type)'
          n=$(grep -cF "$p" "$f")
          [ "$n" = "1" ] || { echo "mutation tripwire: expected 1 claim predicate in $f, found $n. If the schema changed on purpose, update this step and the KQ tests together."; exit 1; }
          grep -vF "$p" "$f" > /tmp/mutant0003.sql
          SCHEMA_SQL_0003=/tmp/mutant0003.sql pytest infra/schema/tests/test_migration_0003.py -k "KQ1 or KQ2" -p no:randomly -p no:xdist --junitxml=mutant3.xml 2>&1 | tee mutant3.log || true
          python infra/ci/scripts/mutation_check.py mutant3.xml --expect test_KQ1 test_KQ2 --no-sentinel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-06-evidence
          path: |
            junit.xml
            pytest.log
            mutant.xml
            mutant.log
            mutant2.xml
            mutant2.log
            mutant3.xml
            mutant3.log
